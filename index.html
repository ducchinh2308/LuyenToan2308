<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Luyện Toán - Thầy Chính</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #2980b9;
            --secondary: #34495e;
            --bg: #f4f7f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 0;
        }

        /* Navbar */
        .navbar {
            background: var(--secondary);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

            .navbar h1 {
                margin: 0;
                font-size: 20px;
            }

        .nav-user {
            display: none;
            align-items: center;
            gap: 15px;
        }

        .btn-logout {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        /* Container & Cards */
        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        /* Inputs & Buttons */
        input[type="text"], input[type="password"], input[type="email"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
        }

            .btn:hover {
                opacity: 0.9;
            }

        /* Sections (To toggle visibility) */
        #khu-vuc-dang-nhap, #khu-vuc-dashboard, #khu-vuc-lam-bai {
            display: none;
        }

        .active-section {
            display: block !important;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <h1>Toán Thầy Chính</h1>
        <div class="nav-user" id="nav-user">
            <span id="txt-ten-user">Xin chào, Học sinh!</span>
            <button class="btn-logout" onclick="dangXuat()">Đăng xuất</button>
        </div>
    </div>

    <div class="container">

        <div id="khu-vuc-dang-nhap" class="card active-section">
            <h2 style="text-align: center; color: var(--primary);">ĐĂNG NHẬP HỆ THỐNG</h2>
            <label>Email:</label>
            <input type="email" id="in_email" placeholder="Nhập email của bạn">
            <label>Mật khẩu:</label>
            <input type="password" id="in_pass" placeholder="Nhập mật khẩu">
            <button class="btn" onclick="dangNhap()">ĐĂNG NHẬP</button>
            <p style="text-align: center; margin-top: 15px;">
                Chưa có tài khoản? <a href="#" style="color: var(--primary);">Đăng ký (Sẽ làm sau)</a>
            </p>
        </div>

        <div id="khu-vuc-dashboard" class="card">
            <h2>📊 Bảng Điều Khiển</h2>
            <div style="display: flex; gap: 20px; flex-wrap: wrap;">
                <div style="flex: 1; min-width: 300px; background: #e8f4f8; padding: 20px; border-radius: 8px;">
                    <h3>Vào phòng thi</h3>
                    <input type="text" id="txtMaDe" placeholder="Nhập mã đề (VD: T12CK2_001)">
                    <button class="btn" onclick="taiDeThi()">Vào thi ngay</button>
                </div>
                <div style="flex: 1; min-width: 300px; background: #fff3e0; padding: 20px; border-radius: 8px;">
                    <h3>Lớp học của tôi</h3>
                    <p>Tính năng Xin vào lớp và Quản lý lớp sẽ được chuyển đổi từ Firebase sang ở bước tiếp theo.</p>
                </div>
            </div>
        </div>

        <div id="khu-vuc-lam-bai">
            <div class="card">
                <button onclick="quayLaiDashboard()" style="margin-bottom:15px; cursor:pointer;">🔙 Quay lại Dashboard</button>
                <h2 id="ten-de" style="text-align:center;"></h2>
                <div id="ket-qua-diem" style="font-size: 18px; font-weight: bold; color: green; text-align: center; display: none;"></div>
                <div id="danh-sach-cau-hoi"></div>
                <button class="btn" id="btnNopBai" style="background:#e74c3c; margin-top:20px;" onclick="nopBai()">NỘP BÀI</button>
            </div>
        </div>

    </div>

    <script>
        // 🛑 DÁN THÔNG TIN SUPABASE CỦA THẦY VÀO ĐÂY
        const SUPABASE_URL = 'https://ffjrjgujzhkjetqyuska.supabase.co';
        const SUPABASE_KEY = 'sb_secret_eCe0UJMeWq6F3BzxZzNxRg_tf6xd9eR';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let duLieuDeGoc = null;

        // --- KIỂM TRA TRẠNG THÁI ĐĂNG NHẬP KHI MỞ WEB ---
        window.onload = async function () {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                currentUser = session.user;
                chuyenManHinh('dashboard');
            } else {
                chuyenManHinh('dang-nhap');
            }
        }

        // --- HÀM ĐĂNG NHẬP BẰNG SUPABASE ---
        async function dangNhap() {
            const email = document.getElementById('in_email').value.trim();
            const pass = document.getElementById('in_pass').value;
            if (!email || !pass) return alert("Vui lòng nhập đủ thông tin!");

            const { data, error } = await supabase.auth.signInWithPassword({ email: email, password: pass });

            if (error) {
                alert("Đăng nhập thất bại: " + error.message);
            } else {
                currentUser = data.user;
                chuyenManHinh('dashboard');
            }
        }

        // --- HÀM ĐĂNG XUẤT ---
        async function dangXuat() {
            await supabase.auth.signOut();
            currentUser = null;
            chuyenManHinh('dang-nhap');
        }

        // --- ĐIỀU HƯỚNG GIAO DIỆN ---
        function chuyenManHinh(manHinh) {
            document.getElementById('khu-vuc-dang-nhap').classList.remove('active-section');
            document.getElementById('khu-vuc-dashboard').classList.remove('active-section');
            document.getElementById('khu-vuc-lam-bai').classList.remove('active-section');

            if (manHinh === 'dang-nhap') {
                document.getElementById('khu-vuc-dang-nhap').classList.add('active-section');
                document.getElementById('nav-user').style.display = 'none';
            }
            else if (manHinh === 'dashboard') {
                document.getElementById('khu-vuc-dashboard').classList.add('active-section');
                document.getElementById('nav-user').style.display = 'flex';
                document.getElementById('txt-ten-user').innerText = currentUser.email; // Tạm hiện email
            }
            else if (manHinh === 'lam-bai') {
                document.getElementById('khu-vuc-lam-bai').classList.add('active-section');
            }
        }

        function quayLaiDashboard() { chuyenManHinh('dashboard'); }

        // =========================================================
        // KHỐI CODE TẢI ĐỀ THI VÀ CHẤM ĐIỂM (Giữ nguyên như lúc nãy)
        // =========================================================
        async function taiDeThi() {
            const maDe = document.getElementById('txtMaDe').value.trim().toUpperCase();
            if (!maDe) return alert("Vui lòng nhập mã đề!");
            try {
                const response = await fetch(`./Export_GitHub/DeThi/${maDe}/DeThi_${maDe}.json`);
                if (!response.ok) throw new Error("Không tìm thấy mã đề này!");
                duLieuDeGoc = await response.json();
                hienThiDeThi(duLieuDeGoc);
            } catch (err) { alert(err.message); }
        }

        function hienThiDeThi(data) {
            chuyenManHinh('lam-bai');
            document.getElementById('ten-de').innerText = data.tenDe;
            const container = document.getElementById('danh-sach-cau-hoi');
            container.innerHTML = '';
            data.danhSachCauHoi.forEach((c, index) => {
                container.innerHTML += `
                    <div class="cau-hoi" id="wrap-cau-${c.maCau}">
                        <p><strong>Câu ${index + 1}:</strong> MÃ CÂU: ${c.maCau}</p>
                        ${c.cauDan ? `<img src="${c.cauDan}" alt="Câu dẫn" style="max-width:100%; display:block; margin-top:10px;">` : ''}
                        ${['A', 'B', 'C', 'D'].map(p => `
                            <label style="display:block; margin:10px 0; cursor:pointer;">
                                <input type="radio" name="ans-${c.maCau}" value="${p}"> <strong>${p}.</strong>
                                ${c['pa' + p] ? `<img src="${c['pa' + p]}" alt="Phương án" style="vertical-align:middle;">` : ''}
                            </label>
                        `).join('')}
                        <div id="lg-${c.maCau}" style="background:#fff8e1; padding:15px; display:none; margin-top:15px;"></div>
                    </div>`;
            });
            MathJax.typeset();
        }

        async function nopBai() {
            if (!confirm("Nộp bài nhé?")) return;
            const { data: keyData, error } = await supabase.from('KhoaBaoMat').select('link_loi_giai, chuoi_dap_an').eq('ma_de', duLieuDeGoc.maDe).single();
            if (keyData) taiLoiGiaiVaChamDiem(keyData.link_loi_giai, keyData.chuoi_dap_an);
            else alert("Lỗi tải đáp án!");
        }

        async function taiLoiGiaiVaChamDiem(tenFileLG, chuoiDapAnDung) {
            const dictGiaiMa = {}; const mangDapAn = chuoiDapAnDung.split(','); let soCauDung = 0;
            mangDapAn.forEach(item => {
                const parts = item.split('|');
                if (parts.length === 3) {
                    dictGiaiMa[parts[1]] = { maCau: parts[0], dapAnDung: parts[2] };
                    const selected = document.querySelector(`input[name="ans-${parts[0]}"]:checked`);
                    if (selected && selected.value === parts[2]) soCauDung++;
                }
            });

            document.getElementById('ket-qua-diem').innerText = `Điểm của bạn: ${((soCauDung / mangDapAn.length) * 10).toFixed(2)}`;
            document.getElementById('ket-qua-diem').style.display = 'block';

            const res = await fetch(`./Export_GitHub/LoiGiai_BaoMat/${tenFileLG}`);
            const listLG = await res.json();
            listLG.forEach(itemLG => {
                const thongTinThat = dictGiaiMa[itemLG.maBaoMat];
                if (thongTinThat) {
                    const divLG = document.getElementById(`lg-${thongTinThat.maCau}`);
                    divLG.innerHTML = `<strong style="color:red;">Đáp án: ${itemLG.dapAn}</strong><br>${itemLG.loiGiai ? `<img src="${itemLG.loiGiai}">` : ''}`;
                    divLG.style.display = 'block';
                }
            });
            document.getElementById('btnNopBai').style.display = 'none';
            alert("Đã chấm xong!");
        }
    </script>
</body>
</html>
