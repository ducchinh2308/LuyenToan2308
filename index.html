<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống luyện thi Toán - Thầy Chính</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <link rel="stylesheet" type="text/css" href="https://tikzjax.com/v1/fonts.css">
    <script src="https://tikzjax.com/v1/tikzjax.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


    <link rel="icon" href="data:,">

</head>
<body>

    <div id="app"></div>

    
    <script>
        // 1. Lấy mốc thời gian hiện tại để lừa trình duyệt tải bản mới nhất
        var phienBanMoiNhat = new Date().getTime();

        // 2. Danh sách các file JS cần nhúng (Thứ tự rất quan trọng: Nền móng để trên, chức năng để dưới)
        var danhSachFiles = [
            'js/app.js',
            'js/khoi8_hs.js',
            'js/khoi9_lambai.js'
            // Sau này có tách thêm file khoi9, khoi10... thầy cứ phẩy rồi gõ thêm tên file vào đây là xong
        ];

        // 3. Vòng lặp tự động đúc thẻ <script> và gắn vào trang
        danhSachFiles.forEach(function (file) {
            var script = document.createElement('script');
            script.src = file + '?v=' + phienBanMoiNhat;

            // 🌟 Lệnh này CỰC KỲ QUAN TRỌNG: Ép các file phải chạy theo đúng thứ tự từ trên xuống dưới
            script.async = false;

            document.body.appendChild(script);
        });
    </script>


</body>
</html>
